; Phase 0 scaffold only -- see docs/stm32_daq.md and the plan this was
; built from. No peripheral-driving logic yet; this exists to validate
; the toolchain/board config compiles cleanly before hardware arrives.
[env:nucleo_h743zi]
platform = ststm32
board = nucleo_h743zi
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -DUSE_HAL_DRIVER
